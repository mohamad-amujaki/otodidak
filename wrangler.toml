"$schema" = "./node_modules/wrangler/config-schema.json"
name = "otodidak"
main = "src/worker.ts"
compatibility_date = "2026-11-13"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[assets]
binding = "ASSETS"
directory = "./dist/client"
run_worker_first = true

# Kunci publishable Clerk di bawah masih instance TEST (aman dipublikasikan).
# Ganti ke instance produksi + set secret CLERK_SECRET_KEY yang cocok sebelum go-live.
[vars]
CLERK_PUBLISHABLE_KEY = "pk_test_bGl2aW5nLWRvdmUtNTE1LmNsZXJrLmFjY291bnRzLmRldiQ"
# Astro reads this name. An empty value stays out of the way until .dev.vars overrides it.
PUBLIC_CLERK_PUBLISHABLE_KEY = ""
APP_ORIGIN = "https://otodidak.web.id"
ENVIRONMENT = "production"
SUPERADMIN_EMAILS = "mohamad.amujaki@gmail.com"

[secrets]
required = [
  "CLERK_SECRET_KEY",
  "BOOTSTRAP_ADMIN_EMAIL",
  "SUMOPOD_API_KEY",
  "SUMOPOD_WEBHOOK_SECRET",
  "SUMOPOD_API_BASE",
  "OPENAI_API_KEY",
  "YOUTUBE_API_KEY",
]

[[d1_databases]]
binding = "DB"
database_name = "otodidak"
database_id = "fd1acffd-2888-43a4-b689-b2e4ad33de26"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "APP_KV"
id = "96eb38579d7f482f861ac51ba3bd6e08"

[[queues.producers]]
binding = "GENERATION_QUEUE"
queue = "generation"

[[queues.consumers]]
queue = "generation"
max_batch_size = 1
max_retries = 3
max_concurrency = 4
dead_letter_queue = "generation-dlq"

[[queues.consumers]]
queue = "generation-dlq"
max_batch_size = 1
max_retries = 1

[[routes]]
pattern = "otodidak.web.id"
custom_domain = true
